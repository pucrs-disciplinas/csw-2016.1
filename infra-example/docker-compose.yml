services:
  ministack:
    image: ministackorg/ministack
    ports:
      - "4566:4566"
    environment:
      PERSIST_STATE: "1"
      STATE_DIR: /data/ministack-state
    volumes:
      - ministack-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4566/_localstack/health')"]
      interval: 10s
      timeout: 5s
      retries: 15

  terraform:
    build: ./terraform
    working_dir: /infra
    volumes:
      - ./terraform:/infra
    environment:
      TF_VAR_ministack_endpoint: http://ministack:4566
    depends_on:
      ministack:
        condition: service_healthy

  # Simulates EC2 — backend Node.js app
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      AWS_ENDPOINT: http://ministack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      S3_BUCKET: infra-example-files
      DYNAMO_TABLE: infra-example-sessions
      DB_HOST: ministack
      DB_PORT: 5432
      DB_NAME: appdb
      DB_USER: appuser
      DB_PASSWORD: apppassword
    depends_on:
      ministack:
        condition: service_healthy
      terraform:
        condition: service_completed_successfully

volumes:
  ministack-data:
