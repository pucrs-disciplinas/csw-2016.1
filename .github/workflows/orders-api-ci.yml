name: Orders API CI

on:
  push:
    paths:
      - "orders-api/**"
      - ".github/workflows/orders-api-ci.yml"
  pull_request:
    paths:
      - "orders-api/**"
      - ".github/workflows/orders-api-ci.yml"

jobs:
  ci:
    name: Build, Lint, Test and Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orders-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: orders-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build

      - name: Run lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Generate coverage report
        run: npm run test:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: orders-api-coverage
          path: orders-api/coverage
          if-no-files-found: error

  release:
    name: Release to GitHub and npm
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        working-directory: orders-api
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: orders-api/package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build

      - name: Get package version
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `orders-api-v${{ steps.pkg.outputs.version }}`,
              name: `orders-api v${{ steps.pkg.outputs.version }}`,
              generate_release_notes: true,
            });

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
