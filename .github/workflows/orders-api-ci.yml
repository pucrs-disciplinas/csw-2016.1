name: Orders API CI

on:
  push:
    paths:
      - "orders-api/**"
      - ".github/workflows/orders-api-ci.yml"
  pull_request:
    paths:
      - "orders-api/**"
      - ".github/workflows/orders-api-ci.yml"

jobs:
  ci:
    name: Build, Lint, Test and Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orders-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: orders-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build

      - name: Run lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Generate coverage report
        run: npm run test:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: orders-api-coverage
          path: orders-api/coverage
          if-no-files-found: error
