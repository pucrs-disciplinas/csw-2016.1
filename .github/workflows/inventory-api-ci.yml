name: Inventory API CI

on:
  push:
    paths:
      - "inventory-api/**"
      - ".github/workflows/inventory-api-ci.yml"
  pull_request:
    paths:
      - "inventory-api/**"
      - ".github/workflows/inventory-api-ci.yml"

jobs:
  ci:
    name: Build, Lint, Test and Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inventory-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: inventory-api/yarn.lock

      - name: Install dependencies
        run: |
          corepack enable
          yarn install --frozen-lockfile

      - name: Run build
        run: yarn build

      - name: Run lint
        run: yarn lint

      - name: Run unit tests
        run: yarn test

      - name: Generate coverage report
        run: yarn test:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: inventory-api-coverage
          path: inventory-api/coverage
          if-no-files-found: error