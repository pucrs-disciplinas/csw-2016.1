info:
  name: Login
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:3000/api/login
  body:
    type: json
    data: |-
      {
        "username": "user",
        "password": "password"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
