services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.5.6
    container_name: keycloak-auth2
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    ports:
      - "8081:8080"
    command: start-dev
  app:
    image: node:24
    container_name: auth-app
    working_dir: /app
    environment:
      - APP_PORT=3000
      - KC_PUBLIC_
      - KC_REALM=master
      - KC_CLIENT_ID=auth-app
      - KC_SERVER_URL=http://keycloak:8080/auth
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - /app/node_modules
    command: npm run dev